 const T=Object.keys(IC),I=(l,p,v)=>`<label>${l}</label><input data-p="${p}" value="${esc(v)}">`,F=(l,k,id)=>`<label>${l}</label><input type="file" data-up="${k}">${id?`<small>✓ uploaded</small> <button class="btn" data-rm="${k}">Remove</button>`:'<small>nothing uploaded</small>'}`;
 d.innerHTML=`<div class="box"><h3 style="margin-top:0">Edit site</h3>`+I('Top bar text','top',W.top)+F('Top bar image','topImg',W.topImgId)+F('Top bar click sound','clickSnd',W.clickSndId)+I('Heading','heading',W.heading)+I('Hint text under the player','hint',W.hint)+`<label>Accent color</label><input type="color" data-p="accent" value="${W.accent}"><h3>Accounts</h3>`
 +W.accounts.map((a,i)=>`<div class="acc"><label>Icon</label><select data-p="accounts.${i}.t">${T.map(t=>`<option${t===a.t?' selected':''}>${t}</option>`).join('')}</select>`+I('Name',`accounts.${i}.n`,a.n)+I('Link',`accounts.${i}.u`,a.u)+I('Note (shown instead of opening the link)',`accounts.${i}.note`,a.note)+`<button class="btn" data-del="${i}">Delete</button></div>`).join('')
 +`<button class="btn" data-add>+ Add account</button><h3>Music (uploading a new song deletes the old one)</h3>`+W.servers.map((s,i)=>I('Server '+(i+1)+' name',`servers.${i}.label`,s.label)+F(s.name||'Song',`servers.${i}`,s.id)).join('')
 +`<p><small id="amsg"></small></p><button class="btn p" data-save>Save</button><button class="btn" data-close>Cancel</button></div>`}
const msg=t=>{const m=$('#amsg');if(m)m.textContent=t};
function drop(k){if(k.startsWith('servers.')){const s=W.servers[+k.split('.')[1]];if(s.id)trash.push(s.id);s.id='';s.name=''}else{if(W[k+'Id'])trash.push(W[k+'Id']);W[k+'Id']=''}}
function remove(k){drop(k);draw()}
async function upload(k,f){try{const as=await claude.use('assets');if(!as)return msg('Upload is not allowed for this account.');msg('Uploading…');const r=await as.upload(f);drop(k);
  if(k.startsWith('servers.')){const s=W.servers[+k.split('.')[1]];s.id=r.id;s.name=f.name}else W[k+'Id']=r.id;draw();msg('Uploaded. Press Save to apply.')}catch(e){msg('Upload failed: '+(e.code||e.message||e))}}
async function save(){W.accounts.forEach(a=>{if(a.u)a.u=safe(a.u)});msg('Saving…');
 try{const as=await claude.use('assets'),art=await claude.use('artifact');if(!art)return msg('Saving is not allowed for this account.');
  if(as)for(const id of trash)await as.delete(id).catch(()=>{});
  await art.publish(buildDoc(W))}catch(e){if(e.code!=='conflict')msg('Save failed: '+(e.code||e.message||e))}}
</script></body></html>
